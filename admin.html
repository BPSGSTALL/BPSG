<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Skill Arcade</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="common.js"></script><script defer src="admin.js"></script></head><body><main class="page"><section class="hero"><div class="eyebrow">Control room</div><h1>Admin dashboard</h1><p>Manage player accounts, virtual credits, game pricing, station counter results, and quiz questions.</p></section><section id="adminLogin" class="auth-wrap panel"><h2>Admin sign in</h2><form id="adminLoginForm"><div class="field"><label>Admin password</label><input id="adminPassword" type="password" required autocomplete="current-password"></div><button class="btn">Unlock dashboard</button></form></section><section id="adminApp" class="hidden"><div class="row between"><h2>Management</h2><button class="btn btn-quiet" id="adminLogout">Lock dashboard</button></div><div id="summary" class="stats"></div><div class="section-title"><h2>Player accounts</h2></div><div class="panel"><form id="createPlayer" class="grid"><div class="field"><label>Username (3–20 characters)</label><input id="newUsername" required pattern="[A-Za-z0-9_]{3,20}"></div><div class="field"><label>PIN (4–6 digits)</label><input id="newPin" required pattern="[0-9]{4,6}" inputmode="numeric"></div><div class="field"><label>Starting credits</label><input id="newCredits" type="number" min="0" value="0" required></div><div class="field"><label> </label><button class="btn">Create player</button></div></form><div class="field"><label>Search players</label><input id="playerSearch" placeholder="Search username…"></div><div id="playersTable"></div></div><div class="section-title"><h2>Credit adjustment / station counter</h2></div><div class="panel"><form id="adjustForm" class="grid"><div class="field"><label>Player username</label><input id="adjustUser" required></div><div class="field"><label>Action</label><select id="adjustAction"><option value="add">Add credits</option><option value="adjust">Adjust (+/-)</option><option value="charge">Charge station game</option><option value="win">Award station win</option></select></div><div class="field"><label>Amount (for add/adjust/win)</label><input id="adjustAmount" type="number" value="10"></div><div class="field"><label>Game (station actions)</label><select id="stationGame"></select></div><div class="field"><label>Reason / note</label><input id="adjustNote" required placeholder="Required reason"></div><div class="field"><label> </label><button class="btn">Apply change</button></div></form></div><div class="section-title"><h2>Game pricing and availability</h2></div><div id="gamesAdmin" class="grid"></div><div class="section-title"><h2>Add quiz question</h2></div><div class="panel"><form id="questionForm" class="grid"><div class="field"><label>Mode</label><select id="qMode"><option value="quiz">Quiz Master</option><option value="kbc">KBC</option></select></div><div class="field"><label>KBC level (1–10)</label><input id="qLevel" type="number" min="1" max="10" value="1"></div><div class="field" style="grid-column:1/-1"><label>Question</label><input id="qText" required></div><div class="field"><label>Correct answer</label><input id="qCorrect" required></div><div class="field"><label>Wrong option 1</label><input id="qWrong1" required></div><div class="field"><label>Wrong option 2</label><input id="qWrong2" required></div><div class="field"><label>Wrong option 3</label><input id="qWrong3" required></div><div class="field"><label> </label><button class="btn">Add question</button></div></form></div><div class="section-title"><h2>PIN reset</h2></div><div class="panel"><form id="pinForm" class="grid"><div class="field"><label>Player username</label><input id="pinUser" required></div><div class="field"><label>New PIN (4–6 digits)</label><input id="resetPin" required pattern="[0-9]{4,6}" inputmode="numeric"></div><div class="field"><label> </label><button class="btn">Reset PIN</button></div></form></div><div class="section-title"><h2>Admin settings</h2></div><div class="panel"><form id="passwordForm" class="row"><div class="field" style="flex:1"><label>New admin password (min 6 characters)</label><input id="newAdminPassword" type="password" minlength="6" required></div><button class="btn">Change password</button></form></div></section><div id="notice" class="notice" hidden></div></main></body></html>
