<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credit History — Skill Arcade</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="common.js"></script><script defer src="history.js"></script></head><body><main class="page"><div class="eyebrow">Transparent ledger</div><div class="section-title"><h2>Transaction history</h2><button id="export" class="btn btn-secondary">Export CSV</button></div><section id="filters" class="panel"><div class="grid"><div class="field"><label>Admin password (for stall-wide reports)</label><input id="adminPassword" type="password" placeholder="Optional"></div><div class="field"><label>Search username</label><input id="search" placeholder="Username or leave blank"></div><div class="field"><label>Transaction type</label><select id="type"><option value="">All types</option><option value="topup">Top-up</option><option value="game_fee">Game fee</option><option value="win">Win/reward</option><option value="adjust">Adjustment/refund</option></select></div><div class="field"><label> </label><button id="load" class="btn">Load history</button></div></div></section><div id="totals" class="stats"></div><div id="table"></div><div id="notice" class="notice" hidden></div></main></body></html>
